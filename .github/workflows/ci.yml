name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kidlearn
          POSTGRES_USER: kidlearn
          POSTGRES_PASSWORD: kidlearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kidlearn -d kidlearn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: cd backend && ./mvnw -q test

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # Builds (never pushes) both production images, so a broken Dockerfile shows up on the PR and
  # not only when a release tag is pushed. Runs in parallel with the other jobs and shares the
  # Buildx layer cache with release.yml, so it adds little to the wall-clock time of CI.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # End-to-end tests (frontend/e2e) on pull requests only: the production frontend build and the
  # backend jar with the "e2e" profile (no dev endpoints, stub LLM/TTS, Mailpit for email) against
  # Postgres + MinIO + Mailpit from infra/e2e/docker-compose.yml. Runs in parallel with the other jobs.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start Postgres, MinIO, Mailpit
        run: docker compose -f infra/e2e/docker-compose.yml up -d --wait

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build backend jar and production frontend
        working-directory: frontend
        run: npm run e2e:build

      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
