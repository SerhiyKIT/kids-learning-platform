spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:kidlearn}
    username: ${POSTGRES_USER:kidlearn}
    password: ${POSTGRES_PASSWORD:kidlearn}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

app:
  # Frontend origin used to build verify-email / reset-password links.
  base-url: ${APP_BASE_URL:http://localhost:3000}
  tts:
    # Single voice for MVP; final provider/voice choice is pending the blind
    # voice test (docs/Формат_подання_уроків_та_ШІ.md §8).
    voice-id: ${TTS_VOICE_ID:default}
  llm:
    # Total LLM generate() calls per lesson-version request before giving up
    # and persisting the last attempt as rejected_auto.
    max-attempts: ${LLM_MAX_ATTEMPTS:2}
  ratelimit:
    # Local dev + the test suite share one simulated client IP (no reverse proxy locally,
    # so no real X-Forwarded-For diversity) and legitimately register far more than 10
    # accounts per run across all the other feature test suites. The production default
    # (10/hour, see the base application.yml) still applies in prod.
    register-per-ip:
      max: 100000
      window: 1h

# Local MinIO instance started via /infra/docker-compose.yml.
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:kidlearn-assets}
