spring:
  application:
    name: backend
  jpa:
    # No session held open for the whole request: every database access happens inside a service
    # transaction, and a connection isn't kept while a slow client reads the response (QA1-005).
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Liveness for the container healthcheck only; nginx doesn't proxy /actuator at all.
      show-details: never
      show-components: never
  health:
    # Mail sending is fire-and-forget (see AuthMailSender); a transient SMTP
    # outage shouldn't flip the whole app's health to DOWN.
    mail:
      enabled: false

auth:
  email-verification-ttl: 24h
  password-reset-ttl: 1h
  teacher-invite-ttl: ${TEACHER_INVITE_TTL:72h}

app:
  retention:
    # docs/Ролі_та_приватність.md: detailed history 2 years (aggregates stay), see RetentionService.
    detailed-history: ${RETENTION_DETAILED_HISTORY:P2Y}
    spent-tokens: 30d
    unverified-accounts: 30d
    cron: ${RETENTION_CRON:0 30 3 * * *}
  # Sender of auth emails (verification, password reset, teacher invites). Unset = the SMTP
  # server's default; prod requires MAIL_FROM.
  mail-from: ${MAIL_FROM:}
  security:
    # Secure flag on the session and CSRF cookies; true in prod (HTTPS only behind nginx).
    secure-cookies: false
  llm:
    # "stub" (default, no network) or "anthropic". The Anthropic provider is wired only when
    # provider=anthropic AND KIDLEARN_LLM_API_KEY is non-blank; otherwise the stub stays active,
    # so CI and local dev never need a key. Never commit a key — env only.
    provider: ${KIDLEARN_LLM_PROVIDER:stub}
    api-key: ${KIDLEARN_LLM_API_KEY:}
    model: ${KIDLEARN_LLM_MODEL:claude-sonnet-5-5}
  tts:
    # "stub" (default, no network) or "google". The Google Cloud TTS provider is wired only when
    # provider=google AND KIDLEARN_TTS_API_KEY is non-blank; otherwise the stub stays active, so
    # CI and local dev never need a key. Never commit a key — env only. A blank voice lets Google
    # pick a voice for the language.
    provider: ${KIDLEARN_TTS_PROVIDER:stub}
    api-key: ${KIDLEARN_TTS_API_KEY:}
    language-code: ${KIDLEARN_TTS_LANGUAGE:uk-UA}
    voice-name: ${KIDLEARN_TTS_VOICE:}
  bootstrap:
    # Blank/unset disables POST /api/bootstrap/admin entirely — see ua.kidlearn.bootstrap's
    # package javadoc. Set at deploy time via ADMIN_BOOTSTRAP_TOKEN; safe to rotate or remove
    # once the first admin exists, since the endpoint stays permanently closed after that.
    admin-token: ${ADMIN_BOOTSTRAP_TOKEN:}
  twofa:
    # AES-GCM key (base64, 32 raw bytes = AES-256) encrypting admin TOTP secrets at rest — see
    # ua.kidlearn.twofa.TwofaEncryptionService. Blank here; application-dev.yml supplies a
    # documented dev-only fallback, application-prod.yml requires TWOFA_ENC_KEY with no default
    # (the app fails to start rather than silently running with no key).
    enc-key: ${TWOFA_ENC_KEY:}
  kid:
    # Child-mode play session (docs/UX_гайд_дитячого_режиму.md §6): the per-child limit itself is
    # a parent setting; these are the rest after reaching it, and the pause that starts a new session.
    rest-duration: ${KIDLEARN_KID_REST_DURATION:60m}
    session-gap: ${KIDLEARN_KID_SESSION_GAP:30m}
  ratelimit:
    # Whether X-Forwarded-For names the client (see ClientIpResolver). Off by default: without our
    # own reverse proxy in front, that header is whatever the client chose to send. Turned on in
    # application-prod.yml (nginx overwrites the header with the connecting address) and in
    # application-dev.yml (tests simulate distinct clients with it; a dev box isn't exposed).
    trust-forwarded-header: false
    login-per-account:
      max: 5
      window: 15m
    # Per-IP limits are sized for a shared address — a kindergarten's Wi-Fi at a parents' meeting,
    # a mobile carrier's CGNAT — where dozens of honest adults arrive from one IP (QA1-022). The
    # per-account limits below are what protects each account, and they stay strict. Every per-IP
    # value can be tuned per deployment from the environment (infra/prod/.env.example).
    login-per-ip:
      max: ${RATELIMIT_LOGIN_PER_IP_MAX:100}
      window: ${RATELIMIT_LOGIN_PER_IP_WINDOW:15m}
    forgot-password-per-ip:
      max: ${RATELIMIT_FORGOT_PASSWORD_PER_IP_MAX:30}
      window: ${RATELIMIT_FORGOT_PASSWORD_PER_IP_WINDOW:15m}
    resend-verification-per-ip:
      max: ${RATELIMIT_RESEND_VERIFICATION_PER_IP_MAX:30}
      window: ${RATELIMIT_RESEND_VERIFICATION_PER_IP_WINDOW:15m}
    register-per-ip:
      max: ${RATELIMIT_REGISTER_PER_IP_MAX:60}
      window: ${RATELIMIT_REGISTER_PER_IP_WINDOW:1h}
    verify-email-per-ip:
      max: ${RATELIMIT_VERIFY_EMAIL_PER_IP_MAX:60}
      window: ${RATELIMIT_VERIFY_EMAIL_PER_IP_WINDOW:15m}
    reset-password-per-ip:
      max: 10
      window: 15m
    accept-invite-per-ip:
      max: ${RATELIMIT_ACCEPT_INVITE_PER_IP_MAX:60}
      window: ${RATELIMIT_ACCEPT_INVITE_PER_IP_WINDOW:15m}
    bootstrap-admin-per-ip:
      max: 5
      window: 15m
    two-factor-per-account:
      max: 5
      window: 15m
    two-factor-per-ip:
      max: 5
      window: 15m
