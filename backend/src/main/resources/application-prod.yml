# All values below must come from environment variables. No defaults, no
# secrets committed here — see /infra/.env.example for the variable names.
spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}

app:
  # One-time first-admin bootstrap (POST /api/bootstrap/admin, see ua.kidlearn.bootstrap). Set
  # ADMIN_BOOTSTRAP_TOKEN at deploy time to create the first admin, then rotate or unset it
  # afterward — the endpoint stays permanently closed once any admin exists, so leaving it set
  # is safe but no longer necessary. Leaving it unset from the start disables the endpoint.
  bootstrap:
    admin-token: ${ADMIN_BOOTSTRAP_TOKEN:}
  # AES-256 key (base64) encrypting admin TOTP secrets at rest — ua.kidlearn.twofa. MUST be set
  # at deploy time (32 random bytes, base64-encoded, e.g. `openssl rand -base64 32`). No default
  # here: the app refuses to start without it rather than risk running with no key at all.
  twofa:
    enc-key: ${TWOFA_ENC_KEY}
  base-url: ${APP_BASE_URL}
  tts:
    voice-id: ${TTS_VOICE_ID}
  llm:
    max-attempts: ${LLM_MAX_ATTEMPTS}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
