# All values below must come from environment variables. No defaults, no
# secrets committed here — see /infra/prod/.env.example for the variable names.
spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          # Off only for a local relay without credentials (the rehearsal's Mailpit).
          auth: ${SMTP_AUTH:true}
          # Port 587 → SMTP_STARTTLS=true; port 465 → SMTP_SSL=true. Never plain text.
          starttls:
            enable: ${SMTP_STARTTLS}
            required: ${SMTP_STARTTLS}
          ssl:
            enable: ${SMTP_SSL}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  # Behind nginx: Tomcat takes the scheme and client address from X-Forwarded-Proto/-For set by
  # nginx (a trusted proxy on the internal docker network), so request.isSecure() is true,
  # redirects use https and Secure cookies are issued.
  forward-headers-strategy: native
  servlet:
    session:
      # Parents and teachers are signed in for at most this long without activity. Child mode
      # runs inside the parent's session and keeps it alive with every request (lesson, answers,
      # audio), so an hour covers a whole play session plus breaks without the adult having to
      # sign in again mid-lesson, while an unattended device still logs out the same day.
      timeout: ${SESSION_TIMEOUT:60m}
      cookie:
        secure: true
        http-only: true
        same-site: lax

app:
  # One-time first-admin bootstrap (POST /api/bootstrap/admin, see ua.kidlearn.bootstrap). Set
  # ADMIN_BOOTSTRAP_TOKEN at deploy time to create the first admin, then rotate or unset it
  # afterward — the endpoint stays permanently closed once any admin exists, so leaving it set
  # is safe but no longer necessary. Leaving it unset from the start disables the endpoint.
  bootstrap:
    admin-token: ${ADMIN_BOOTSTRAP_TOKEN:}
  # AES-256 key (base64) encrypting admin TOTP secrets at rest — ua.kidlearn.twofa. MUST be set
  # at deploy time (32 random bytes, base64-encoded, e.g. `openssl rand -base64 32`). No default
  # here: the app refuses to start without it rather than risk running with no key at all.
  twofa:
    enc-key: ${TWOFA_ENC_KEY}
  base-url: ${APP_BASE_URL}
  mail-from: ${MAIL_FROM}
  security:
    secure-cookies: true
  ratelimit:
    # nginx overwrites X-Forwarded-For with the connecting address (infra/prod/nginx), so the
    # header names the real client; see ClientIpResolver.
    trust-forwarded-header: true
  tts:
    voice-id: ${TTS_VOICE_ID}
  llm:
    max-attempts: ${LLM_MAX_ATTEMPTS}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
