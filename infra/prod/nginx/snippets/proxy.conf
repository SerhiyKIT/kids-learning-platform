# Headers every proxied request carries. X-Forwarded-For is OVERWRITTEN with the address that
# connected to nginx (never appended to): whatever a client sends in that header is discarded,
# so the backend's per-IP rate limits can't be dodged (see ClientIpResolver).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
